        name: abogado-id
        description: usuario_id del abogado que registró el contrato
        type: integer
        format: int64
      - in: query
        name: dependencia-solicitante-id
        description: Una o varias dependencias solicitantes separadas por coma. e.g.
          31,45
        type: string
      responses:
        "200":
          description: ""
          schema:
            type: array
            items:
              $ref: '#/definitions/models.ContratoTablero'
        "400":
          description: filtro inválido
